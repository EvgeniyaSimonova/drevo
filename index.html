<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Семейное древо</title>
<meta name="theme-color" content="#f4f1ea">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Древо">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2b2a26;--muted:#6f6a60;--line:#ddd5c6;--acc:#8a4b2a;--err:#a33a2a}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--card:#262522;--ink:#ece7dc;--muted:#a49d90;--line:#3a3833;--acc:#d08b5f;--err:#e27a68}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px 22px}
svg{display:block;margin:0 0 14px}
h1{font:600 28px/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}
p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input[type=password]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:14px;color:var(--muted)}
button{width:100%;font:600 16px/1 inherit;font-family:inherit;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:20px;margin:12px 0 0;font-size:14px;color:var(--muted)}
#msg.err{color:var(--err)}
</style>
</head>
<body>
<main>
<form class="box" id="f" autocomplete="on">
  <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M22 30v8M12 22v-4h20v4M22 18v-6"/></g><g fill="currentColor"><circle cx="22" cy="8" r="4.5"/><circle cx="12" cy="26" r="4.5"/><circle cx="32" cy="26" r="4.5"/><circle cx="22" cy="40" r="3"/></g></svg>
  <h1>Семейное древо</h1>
  <p class="sub">Симоновы · Аввакумовы · Мироновы · Батуевы · Никулины · Маусовы · Сопляковы · Ларины · Андрюшины</p>
  <input type="text" name="username" value="semya" autocomplete="username" hidden>
  <label for="pw">Пароль семьи</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <label class="row"><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Открыть</button>
  <div id="msg" role="status"></div>
</form>
</main>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
const $=id=>document.getElementById(id), hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const KEY='drevo-pw';
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function unlock(pw){
  let res;try{res=await fetch('data.bin',{cache:'no-cache'})}catch(e){res=await caches.match('data.bin')}
  const buf=new Uint8Array(await res.arrayBuffer());
  if(String.fromCharCode(...buf.slice(0,4))!=='DRV1')throw new Error('файл повреждён');
  const salt=buf.slice(4,20),iv=buf.slice(20,32),it=new DataView(buf.buffer,32,4).getUint32(0),data=buf.slice(36);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
async function go(pw,auto){
  $('go').disabled=true;$('msg').className='';$('msg').textContent='Открываю древо…';
  let html;
  try{html=await unlock(pw)}catch(e){
    $('go').disabled=false;
    if(auto){store(KEY,null);$('msg').textContent='';return}
    $('msg').className='err';
    $('msg').textContent=(e&&e.name==='OperationError')?'Неверный пароль.':'Не получилось открыть: '+(e&&e.message||e);
    return}
  if($('rem').checked||auto)store(KEY,pw);
  document.open();document.write(html);document.close();
}
$('f').addEventListener('submit',e=>{e.preventDefault();go($('pw').value,false)});
const saved=load(KEY); if(saved)go(saved,true);
</script>
</body>
</html>
